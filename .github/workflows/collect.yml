# 매일 아침 7시(한국시간)에 나라장터 공고를 수집해서 저장소에 저장하는 자동화 설정입니다.
# 이 파일은 GitHub가 읽어서 알아서 실행합니다. 내 컴퓨터가 꺼져 있어도 돌아갑니다.

name: 공고 수집

on:
  schedule:
    # GitHub는 세계표준시(UTC)를 씁니다. 한국시간은 UTC보다 9시간 빠릅니다.
    # 한국 오전 7시 = UTC 전날 밤 10시 -> '0 22 * * *'
    - cron: "0 22 * * *"
  workflow_dispatch: # Actions 탭에서 'Run workflow' 버튼으로 수동 실행도 가능하게 함

# 수집 결과를 저장소에 커밋하려면 쓰기 권한이 필요합니다.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # 1) 내 저장소 코드를 작업용 컴퓨터로 내려받습니다.
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      # 2) 파이썬을 설치합니다. (추가 라이브러리 설치는 필요 없습니다)
      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3) 수집 스크립트를 실행합니다.
      #    API 키는 GitHub Secrets에 저장된 값을 환경변수로 넘겨줍니다.
      #    (코드 어디에도 키가 적혀 있지 않습니다)
      - name: 공고 수집 실행
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: python scripts/collect.py

      # 4) 결과가 달라졌으면 저장소에 커밋합니다.
      #    달라진 게 없으면 아무 일도 하지 않습니다.
      - name: 결과 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
          else
            git commit -m "공고 자동 수집: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi

      # 5) 수집이 실패했다면 여기서 빨간 X 표시를 내서 알려줍니다.
      #    (이미 4번에서 이전 데이터는 그대로 보존된 상태입니다)
      - name: 수집 성공 여부 확인
        run: |
          python - <<'EOF'
          import json, os, sys

          if not os.path.exists("data/status.json"):
              print("::error::상태 파일이 없습니다. 위쪽 '공고 수집 실행' 단계의 로그를 확인하세요.")
              sys.exit(1)

          status = json.load(open("data/status.json", encoding="utf-8"))
          print("상태:", status)
          if not status.get("ok"):
              print("::error::공고 수집 실패 - " + str(status.get("message")))
              sys.exit(1)
          print("수집 성공: %s건" % status.get("count"))
          EOF

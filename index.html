<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나라장터 입찰공고 퀵 브리핑</title>
  <meta name="description" content="키워드로 걸러 매일 아침 빠르게 받아보는 맞춤 입찰·사전규격" />
  <meta name="author" content="홍요셉 (북크리에이션)" />

  <!-- 한글 폰트 Pretendard (무료, CDN에서 바로 불러옵니다) -->
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <style>
    /* ---------- 색상/기본값 한 곳에 모아두기 ---------- */
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1a1d24;
      --text-sub: #626b7d;
      --line: #e3e7ef;
      --point: #2563eb;        /* 기본 포인트 색 (파랑) */
      --point-soft: #eaf1ff;
      --urgent: #dc2626;       /* 마감 임박 (빨강) */
      --urgent-soft: #fdeaea;
      --closed: #9aa3b2;       /* 마감됨 (회색) */
      --warn-bg: #fff7e6;
      --warn-line: #ffd48a;
      --star: #f59e0b;         /* 관심 공고 (노랑) */
      --star-soft: #fff6e0;
      --new: #059669;          /* 새 공고 (초록) */
      --new-soft: #e3f7ee;
      --ai: #7c3aed;           /* AI 브리프 (보라) */
      --ai-soft: #f1eafe;
      --radius: 14px;
    }

    /* 어두운 화면을 쓰는 기기에서는 자동으로 다크 테마 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161b;
        --card: #1c1f27;
        --text: #eceef2;
        --text-sub: #9aa3b2;
        --line: #2b3039;
        --point: #6f9dff;
        --point-soft: #1e2a44;
        --urgent: #ff7b7b;
        --urgent-soft: #3a2020;
        --warn-bg: #33290f;
        --warn-line: #6b5518;
        --star: #fbbf24;
        --star-soft: #3a2f12;
        --new: #34d399;
        --new-soft: #133328;
        --ai: #b69cff;
        --ai-soft: #2a2145;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 16px 64px;
      background: var(--bg);
      color: var(--text);
      /* Pretendard를 첫 번째로, 없으면 기기 기본 한글 폰트 */
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
                   'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
      /* 한글이 단어 중간에서 어색하게 끊기지 않도록 */
      word-break: keep-all;
      overflow-wrap: break-word;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }

    .wrap { max-width: 760px; margin: 0 auto; }

    /* ---------- 머리말 ---------- */
    header { padding: 28px 0 8px; }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }

    .sub { color: var(--text-sub); font-size: 14px; margin: 0; }
    .nowrap { white-space: nowrap; }

    /* ---------- 안내 배너 (수집 실패 시에만 표시) ---------- */
    .banner {
      display: none;
      margin: 14px 0 0;
      padding: 12px 14px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
      border-radius: var(--radius);
      font-size: 13px;
    }

    /* ---------- 입찰공고 / 사전규격 탭 ---------- */
    .tabs {
      display: flex;
      gap: 6px;
      margin: 18px 0 0;
      padding: 4px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .tab {
      flex: 1;
      padding: 10px 8px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-sub);
      background: transparent;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--point); color: #fff; }
    .tab-note { font-size: 13px; color: var(--text-sub); margin: 10px 2px 0; }

    /* ---------- 검색창 / 필터 ---------- */
    .search {
      width: 100%;
      margin: 14px 0 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .search:focus, .select:focus { outline: 2px solid var(--point); outline-offset: 1px; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .chip {
      padding: 8px 14px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: 0.15s;
    }
    .chip:hover { border-color: var(--point); color: var(--point); }
    .chip[aria-pressed="true"] {
      background: var(--point);
      border-color: var(--point);
      color: #fff;
    }

    .selects { display: flex; gap: 8px; margin-bottom: 14px; }
    .select {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .count { font-size: 13px; color: var(--text-sub); margin: 0 0 6px; }

    /* ---------- 구역 제목 (관심 / 새 공고 / 전체) ---------- */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 22px 0 10px;
    }
    .section-head h2 { font-size: 17px; font-weight: 800; margin: 0; }
    .section-head h2 small { font-size: 13px; font-weight: 600; color: var(--text-sub); margin-left: 4px; }
    .mini-btn {
      flex-shrink: 0;
      padding: 6px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
    }
    .mini-btn:hover { border-color: var(--point); color: var(--point); }
    .section-empty {
      padding: 16px;
      font-size: 13px;
      color: var(--text-sub);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    /* ---------- 공고 카드 ---------- */
    .list { display: flex; flex-direction: column; gap: 12px; }

    .card {
      position: relative;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      transition: 0.15s;
    }
    .card:hover { border-color: var(--point); }
    .card.is-closed { opacity: 0.55; }
    .card.is-fav { border-color: var(--star); box-shadow: inset 4px 0 0 var(--star); }
    .card.is-new { box-shadow: inset 4px 0 0 var(--new); }

    .card-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 40px 8px 0;   /* 오른쪽 위 별 버튼 자리 */
      flex-wrap: wrap;
    }

    .dday {
      flex-shrink: 0;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      background: var(--point-soft);
      color: var(--point);
    }
    .dday.urgent { background: var(--urgent-soft); color: var(--urgent); }
    .dday.closed { background: transparent; color: var(--closed); border: 1px solid var(--line); }

    .badge-new {
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      border-radius: 6px;
      background: var(--new);
      color: #fff;
    }
    .tag {
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      background: var(--point-soft);
      color: var(--point);
    }
    .tag.gray { background: transparent; color: var(--text-sub); border: 1px solid var(--line); }
    .tag.warn { background: var(--urgent-soft); color: var(--urgent); }

    .star {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      font-size: 20px;
      line-height: 1;
      color: var(--closed);
      background: transparent;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }
    .star:hover { background: var(--star-soft); color: var(--star); }
    .star[aria-pressed="true"] { color: var(--star); }

    .title {
      display: block;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      margin: 0 0 10px;
      color: inherit;
      text-decoration: none;
    }
    a.title:hover { color: var(--point); text-decoration: underline; }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      color: var(--text-sub);
    }
    .meta b { color: var(--text); font-weight: 600; }
    .meta-label { display: inline-block; min-width: 56px; }

    /* 첨부파일 (제안요청서 등) */
    .files { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .file-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      max-width: 100%;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--point);
      background: var(--point-soft);
      border-radius: 8px;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-btn:hover { text-decoration: underline; }
    .files details { width: 100%; font-size: 13px; color: var(--text-sub); }
    .files summary { cursor: pointer; padding: 2px 0; }
    .files details a { display: block; padding: 3px 0 3px 14px; color: var(--point); }

    .linked {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--new);
    }
    .linked a { color: inherit; }

    /* 관심 공고 진행 상태 / 메모 */
    .fav-box {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }
    .fav-box .select { flex: 0 0 auto; width: auto; }
    .memo {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .gone-note { margin-top: 8px; font-size: 12px; color: var(--text-sub); }

    .empty {
      padding: 48px 16px;
      text-align: center;
      color: var(--text-sub);
      font-size: 14px;
    }

    footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
    }
    .backup { margin-top: 10px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

    /* ---------- Go/No-Go 판단 프롬프트 ---------- */
    .brief-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .ai-btn {
      padding: 7px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--ai);
      background: var(--ai-soft);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
    }
    .ai-btn:hover { border-color: var(--ai); }

    .brief-modal {
      width: min(720px, calc(100vw - 24px));
      max-height: calc(100vh - 32px);
      padding: 0;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
    }
    .brief-modal::backdrop { background: rgba(10, 12, 18, 0.55); }
    .brief-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .brief-kicker { margin: 0 0 2px; font-size: 12px; font-weight: 700; color: var(--ai); }
    .brief-head h3 { margin: 0; font-size: 16px; line-height: 1.4; }
    .brief-close {
      flex-shrink: 0;
      width: 34px; height: 34px;
      font-size: 16px;
      color: var(--text-sub);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 50%;
      cursor: pointer;
    }
    .brief-body { padding: 16px 18px 20px; }
    .brief-section {
      margin-bottom: 14px;
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .brief-section h4 { display: inline; margin: 0; font-size: 15px; }
    .brief-section > h4 { display: block; margin-bottom: 10px; }
    .brief-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 4px;
      cursor: pointer;
      border-top: 1px solid var(--line);
    }
    .brief-option:first-of-type { border-top: 0; }
    .brief-option input { margin-top: 5px; accent-color: var(--ai); }
    .brief-option span { display: flex; flex-direction: column; }
    .brief-option small { color: var(--text-sub); font-size: 12px; }
    .brief-option:has(input:disabled) { opacity: 0.6; cursor: default; }
    .brief-panel { margin: 2px 0 8px 28px; }
    .brief-drop {
      padding: 18px 12px;
      font-size: 13px;
      color: var(--text-sub);
      text-align: center;
      border: 2px dashed var(--line);
      border-radius: 12px;
      cursor: pointer;
    }
    .brief-drop:hover, .brief-drop.is-over { border-color: var(--ai); color: var(--ai); background: var(--ai-soft); }
    .brief-textarea, .brief-field input {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      resize: vertical;
    }
    .brief-field { display: block; margin-bottom: 10px; font-size: 13px; font-weight: 600; }
    .brief-field > span { display: block; margin-bottom: 4px; }
    .brief-field small { font-weight: 400; color: var(--text-sub); }
    .brief-field .select { width: 100%; }
    .brief-hint { margin: 6px 0 0; font-size: 12px; color: var(--text-sub); }
    .brief-hint a { color: var(--point); }
    .brief-error {
      margin: 0 0 12px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--urgent);
      background: var(--urgent-soft);
      border-radius: 10px;
    }
    .brief-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 4px; }
    .brief-info {
      margin: 0 0 12px;
      padding: 10px 12px;
      font-size: 13px;
      background: var(--new-soft);
      border-radius: 10px;
    }
    .brief-info a { color: var(--point); font-weight: 700; }
    a.mini-btn { display: inline-block; text-decoration: none; }
    .brief-section h4 small { font-size: 12px; font-weight: 400; color: var(--text-sub); }
    .gng-facts { margin: 0; font-size: 13px; color: var(--text-sub); }
    .gng-row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; }
    .gng-row .brief-hint { margin: 0; }
    .gng-open {
      margin-top: 12px;
      padding: 9px 14px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--ai);
      background: var(--ai-soft);
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
    }
    .gng-open:hover { border-color: var(--ai); }
    .gng-open small { font-weight: 400; color: var(--text-sub); }
    .brief-primary {
      padding: 12px 22px;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      color: var(--card);      /* 라이트: 흰 글자 / 다크: 어두운 글자 (밝은 보라 바탕에서 잘 보이게) */
      background: var(--ai);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
    @media (max-width: 560px) {
      .brief-modal { width: 100vw; max-width: 100vw; max-height: 100dvh; height: 100dvh; border-radius: 0; }
    }

    /* 제작자 표시 + 문의처 */
    .credit {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.9;
    }
    .credit-name { color: var(--text-sub); }
    .credit-name b { color: var(--text); font-weight: 700; }
    .credit-contact a {
      color: var(--point);
      font-weight: 700;
      text-decoration: none;
    }
    .credit-contact a:hover { text-decoration: underline; }
    .credit-contact .bar { margin: 0 8px; color: var(--line); }

    /* PC 화면에서는 글씨를 조금 키웁니다 */
    @media (min-width: 640px) {
      h1 { font-size: 28px; }
      .title { font-size: 17px; }
      .meta { flex-direction: row; flex-wrap: wrap; gap: 4px 18px; }
    }
    /* 좁은 화면에서는 상태/메모를 위아래로 */
    @media (max-width: 480px) {
      .fav-box { flex-direction: column; }
      .fav-box .select { width: 100%; }
    }
  </style>
</head>

<body>
<div class="wrap">

  <header>
    <h1>📰 나라장터 입찰공고 퀵 브리핑</h1>
    <p class="sub">키워드로 걸러 매일 아침 빠르게 받아보는 <span class="nowrap">맞춤 입찰·사전규격</span></p>
    <button class="gng-open" id="gng-open">🧭 Go/No-Go 판단 프롬프트 <small>· 관심 공고 원문을 붙여넣어 claude.ai로 판단</small></button>
    <div class="banner" id="banner"></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="bid" id="tab-bid">입찰공고</button>
    <button class="tab" role="tab" data-tab="spec" id="tab-spec">사전규격</button>
  </div>
  <p class="tab-note" id="tab-note"></p>

  <input type="search" class="search" id="search" placeholder="공고명·기관명으로 검색" />

  <div class="filters" id="filters"></div>

  <div class="selects">
    <select class="select" id="budget" aria-label="예산 필터"></select>
    <select class="select" id="region" aria-label="지역 필터"></select>
  </div>

  <p class="count" id="count">불러오는 중…</p>

  <div id="list"></div>

  <footer>
    <span id="updated">—</span><br />
    데이터 출처: 조달청 나라장터 입찰공고정보서비스·사전규격정보서비스 (공공데이터포털)<br />
    ⭐ 관심 공고·진행 상태·메모는 이 브라우저에만 저장됩니다. 다른 기기로 옮길 때는 백업을 쓰세요.
    <div class="backup">
      <button class="mini-btn" id="export">관심 공고 백업 내려받기</button>
      <button class="mini-btn" id="import">백업 불러오기</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden />
    </div>

    <div class="credit">
      <div class="credit-name">Made by <b>홍요셉</b> (북크리에이션)</div>
      <div class="credit-contact">
        문의 :
        <a href="https://open.kakao.com/me/yosepAI" target="_blank" rel="noopener">카카오 오픈채팅</a>
        <span class="bar" aria-hidden="true">|</span>
        <a href="https://hongyosep-profile.vercel.app/" target="_blank" rel="noopener">홍요셉 공식홈페이지</a>
      </div>
    </div>
  </footer>

</div>

<script>
/* =========================================================================
   화면에 목록을 그리는 코드입니다.
   data/notices.json(입찰공고), data/prespecs.json(사전규격)을 읽어와 카드로 보여줍니다.
   관심 공고·진행 상태·메모·'확인함' 기록은 브라우저 저장소(localStorage)에 둡니다.
   ========================================================================= */

var STORE_KEY = "bidRadar.v1";
var STATUS_LIST = ["검토중", "제안준비", "제출완료", "선정", "미선정", "보류"];
var REGION_ORDER = ["서울", "경기", "인천", "강원", "대전", "세종", "충북", "충남", "광주",
                    "전북", "전남", "대구", "경북", "부산", "울산", "경남", "제주", "전국·기타"];
var BUDGETS = [
  { value: "",                     label: "예산 전체" },
  { value: "0-50000000",           label: "5천만원 미만" },
  { value: "50000000-100000000",   label: "5천만원 ~ 1억" },
  { value: "100000000-300000000",  label: "1억 ~ 3억" },
  { value: "300000000-1000000000", label: "3억 ~ 10억" },
  { value: "1000000000-",          label: "10억 이상" },
  { value: "none",                 label: "예산 미공개" }
];
var TAB_NOTES = {
  bid: "입찰 마감이 빠른 순서입니다. ☆를 누르면 관심 공고로 맨 위에 고정됩니다.",
  spec: "사전규격은 본공고 전에 미리 공개되는 규격안입니다. 의견등록 마감 뒤 본공고로 이어지는 경우가 많아 준비를 일찍 시작할 수 있습니다."
};

var data = { bid: [], spec: [], keywords: [], updated: { bid: "", spec: "" }, loaded: { bid: false, spec: false } };
var ui = { tab: "bid", keyword: "전체", search: "", budget: "", region: "" };
var store = loadStore();

/* ---------- 1) 브라우저 저장소 (실패해도 화면은 돌아가게) ---------- */
function loadStore() {
  var empty = { favs: {}, seen: {}, ack: {}, ui: {} };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!saved || typeof saved !== "object") return empty;
    saved.favs = saved.favs || {};
    saved.seen = saved.seen || {};
    saved.ack = saved.ack || {};
    saved.ui = saved.ui || {};
    return saved;
  } catch (e) {
    return empty;
  }
}

function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* 저장 불가(사생활 보호 모드 등) */ }
}

function keyOf(type, item) { return type + ":" + item.id; }

/* ---------- 2) 글자/숫자 다듬기 ---------- */
/* 예산 금액을 읽기 쉽게 바꿉니다. 예) 120000000 -> 1억 2,000만원 */
function formatBudget(amount) {
  if (!amount || amount <= 0) return "미공개";
  var eok = Math.floor(amount / 100000000);          // 억
  var man = Math.floor((amount % 100000000) / 10000); // 만
  if (eok > 0) {
    return man > 0
      ? eok + "억 " + man.toLocaleString() + "만원"
      : eok + "억원";
  }
  if (man > 0) return man.toLocaleString() + "만원";
  return amount.toLocaleString() + "원";
}

/* HTML에 그대로 넣으면 위험한 글자를 안전하게 바꿉니다. */
function escapeHtml(text) {
  return String(text == null ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* http(s)로 시작하는 주소만 링크로 씁니다. */
function safeUrl(url) {
  return /^https?:\/\//i.test(url || "") ? url : "";
}

/* "2026-10-19 11:50:37"(한국시간) -> 초 단위 숫자 */
function kstToSec(text) {
  if (!text) return 0;
  var ms = Date.parse(String(text).replace(" ", "T") + "+09:00");
  return isNaN(ms) ? 0 : ms / 1000;
}

/* 마감까지 남은 기간을 계산합니다. prefix는 사전규격일 때 '의견마감 ' */
function getDday(closeTs, prefix) {
  prefix = prefix || "";
  if (!closeTs) return { text: prefix + "마감일 미정", cls: "closed", closed: false };

  var diffSec = closeTs - Date.now() / 1000;
  if (diffSec < 0) return { text: prefix + "마감", cls: "closed", closed: true };

  var days = Math.floor(diffSec / 86400);
  if (days === 0) {
    var hours = Math.max(1, Math.floor(diffSec / 3600));
    return { text: prefix + "오늘 마감 (" + hours + "시간)", cls: "urgent", closed: false };
  }
  return {
    text: prefix + "D-" + days,
    cls: days <= 3 ? "urgent" : "",   // 3일 이하는 빨간색으로 강조
    closed: false
  };
}

/* ---------- 3) NEW 판단 ---------- */
/* '모두 확인함'을 누른 시각 이후 처음 발견된 공고 중, 아직 열어보지 않은 것이 NEW입니다.
   처음 방문했다면 마지막 수집 하루 전을 기준으로 삼습니다. */
function ackTs(type) {
  if (store.ack[type]) return store.ack[type];
  var updated = kstToSec(data.updated[type]);
  return updated ? updated - 86400 : 0;
}

function isNew(type, item) {
  if (!item.first_seen_ts) return false;
  if (store.seen[keyOf(type, item)]) return false;
  return item.first_seen_ts > ackTs(type);
}

function markSeen(type, id) {
  store.seen[type + ":" + id] = 1;
  saveStore();
}

/* 새 공고 '모두 확인함': 지금 시각을 기준으로 다시 잡습니다. */
function ackAll() {
  store.ack[ui.tab] = Date.now() / 1000;
  Object.keys(store.seen).forEach(function (k) {
    if (k.indexOf(ui.tab + ":") === 0) delete store.seen[k];
  });
  saveStore();
  render();
}

/* ---------- 4) 관심 공고 ---------- */
function toggleFav(type, id) {
  var key = type + ":" + id;
  var fav = store.favs[key];
  if (fav) {
    if (fav.memo && !confirm("메모가 적힌 관심 공고입니다. 별표를 해제할까요?\n(메모와 진행 상태도 함께 지워집니다)")) return;
    delete store.favs[key];
  } else {
    var item = findItem(type, id);
    if (!item) return;
    store.favs[key] = { status: "검토중", memo: "", added: Date.now(), item: item };
    store.seen[key] = 1;       // 별표를 눌렀으면 확인한 것으로 봅니다
  }
  saveStore();
  render();
}

function updateFav(key, field, value) {
  if (!store.favs[key]) return;
  store.favs[key][field] = value;
  saveStore();
}

function findItem(type, id) {
  var rows = data[type];
  for (var i = 0; i < rows.length; i++) if (rows[i].id === id) return rows[i];
  return null;
}

/* 최신 목록에 있으면 최신 정보로, 없으면 저장해 둔 사본으로 관심 공고 목록을 만듭니다. */
function favItems(type) {
  var list = [];
  Object.keys(store.favs).forEach(function (key) {
    if (key.indexOf(type + ":") !== 0) return;
    var fav = store.favs[key];
    var latest = findItem(type, key.slice(type.length + 1));
    if (latest) fav.item = latest;                 // 사본도 최신으로 바꿔 둡니다
    list.push({ item: fav.item, gone: !latest });
  });
  saveStore();
  return list;
}

/* ---------- 5) 필터 ---------- */
function passFilters(item) {
  // (1) 키워드 버튼
  if (ui.keyword !== "전체") {
    if (!item.matched || item.matched.indexOf(ui.keyword) === -1) return false;
  }
  // (2) 검색창
  if (ui.search) {
    var haystack = (item.title + " " + item.agency + " " + item.demand_agency).toLowerCase();
    if (haystack.indexOf(ui.search) === -1) return false;
  }
  // (3) 예산
  if (ui.budget) {
    var budget = item.budget || 0;
    if (ui.budget === "none") {
      if (budget > 0) return false;
    } else {
      var range = ui.budget.split("-");
      var min = Number(range[0]) || 0;
      var max = range[1] ? Number(range[1]) : Infinity;
      if (!(budget > 0 && budget >= min && budget < max)) return false;
    }
  }
  // (4) 지역
  if (ui.region && (item.region || "전국·기타") !== ui.region) return false;
  return true;
}

/* 정렬: 입찰공고는 마감 임박순(마감된 건 뒤로), 사전규격은 최근 공개순 */
function sortRows(type, rows) {
  var nowSec = Date.now() / 1000;
  return rows.sort(function (a, b) {
    a = a.item || a; b = b.item || b;
    if (type === "spec") return (b.notice_ts || 0) - (a.notice_ts || 0);
    var aDone = a.close_ts && a.close_ts < nowSec ? 1 : 0;
    var bDone = b.close_ts && b.close_ts < nowSec ? 1 : 0;
    if (aDone !== bDone) return aDone - bDone;
    return (a.close_ts || 9999999999) - (b.close_ts || 9999999999);
  });
}

/* ---------- 6) 카드 한 장 ---------- */
function renderFiles(type, item) {
  var files = item.files || [];
  if (!files.length) return "";
  var label = function (f, i) {
    return type === "spec" && /^첨부파일 \d+$/.test(f.name) ? "규격서 파일 " + (i + 1) : f.name;
  };
  var link = function (f, i, cls) {
    var url = safeUrl(f.url);
    if (!url) return "";
    return '<a class="' + cls + '" href="' + escapeHtml(url) + '" target="_blank" rel="noopener" ' +
           'data-act="open" data-type="' + type + '" data-id="' + escapeHtml(item.id) + '">' +
           (cls === "file-btn" ? "📄 " : "") + escapeHtml(label(f, i)) + "</a>";
  };

  var rfp = files.filter(function (f) { return f.rfp; });
  var html = rfp.map(function (f) { return link(f, files.indexOf(f), "file-btn"); }).join("");

  // 사전규격은 파일 이름이 따로 없어서 모두 버튼으로 보여줍니다.
  if (type === "spec") {
    return '<div class="files">' + files.map(function (f, i) { return link(f, i, "file-btn"); }).join("") + "</div>";
  }
  html += '<details><summary>' + (rfp.length ? "첨부파일 전체 " : "📎 첨부파일 ") + files.length + "개</summary>" +
          files.map(function (f, i) { return link(f, i, ""); }).join("") + "</details>";
  return '<div class="files">' + html + "</div>";
}

function renderCard(type, item, opts) {
  opts = opts || {};
  var key = keyOf(type, item);
  var fav = store.favs[key];
  var fresh = !fav && isNew(type, item);
  var dday = getDday(item.close_ts, type === "spec" ? "의견마감 " : "");
  var closed = type === "bid" && dday.closed;   // 사전규격은 의견마감이 지나도 흐리게 하지 않습니다

  var tags = (item.matched || []).map(function (word) {
    return '<span class="tag">' + escapeHtml(word) + "</span>";
  }).join("");
  if (item.kind && item.kind !== "등록공고") {
    tags += '<span class="tag ' + (item.kind.indexOf("취소") > -1 ? "warn" : "gray") + '">' + escapeHtml(item.kind) + "</span>";
  }
  if (item.renotice && (item.kind || "").indexOf("재공고") === -1) tags += '<span class="tag gray">재공고</span>';

  var link = safeUrl(item.link);
  var title = link
    ? '<a class="title" href="' + escapeHtml(link) + '" target="_blank" rel="noopener" data-act="open" data-type="' +
      type + '" data-id="' + escapeHtml(item.id) + '">' + escapeHtml(item.title) + "</a>"
    : '<p class="title">' + escapeHtml(item.title) + "</p>";

  var meta = type === "spec"
    ? '<span><span class="meta-label">발주기관</span><b>' + escapeHtml(item.agency || "-") + "</b></span>" +
      '<span><span class="meta-label">배정예산</span><b>' + escapeHtml(formatBudget(item.budget)) + "</b></span>" +
      '<span><span class="meta-label">공개일</span><b>' + escapeHtml(item.notice_date || "-") + "</b></span>" +
      '<span><span class="meta-label">의견마감</span><b>' + escapeHtml(item.close_date || "-") + "</b></span>" +
      '<span><span class="meta-label">지역</span><b>' + escapeHtml(item.region || "전국·기타") + "</b></span>" +
      '<span><span class="meta-label">규격번호</span><b>' + escapeHtml(item.id) + "</b></span>"
    : '<span><span class="meta-label">발주기관</span><b>' + escapeHtml(item.agency || "-") + "</b></span>" +
      '<span><span class="meta-label">예산</span><b>' + escapeHtml(formatBudget(item.budget)) + "</b></span>" +
      '<span><span class="meta-label">마감일시</span><b>' + escapeHtml(item.close_date || "미정") + "</b></span>" +
      '<span><span class="meta-label">지역</span><b>' + escapeHtml(item.region || "전국·기타") + "</b></span>";

  // 사전규격 -> 본공고가 나왔으면 알려줍니다.
  var linked = "";
  if (type === "spec") {
    var bid = data.bid.filter(function (b) { return b.prespec_no && b.prespec_no === item.id; })[0];
    if (bid && safeUrl(bid.link)) {
      linked = '<p class="linked">📢 본공고가 나왔습니다 → <a href="' + escapeHtml(bid.link) +
               '" target="_blank" rel="noopener">' + escapeHtml(bid.close_date ? "마감 " + bid.close_date : "공고 보기") + "</a></p>";
    } else if (item.bid_nos) {
      linked = '<p class="linked">📢 본공고 게시됨 (공고번호 ' + escapeHtml(item.bid_nos) + ")</p>";
    }
  }

  var favBox = "";
  if (fav) {
    favBox = '<div class="fav-box">' +
      '<select class="select" data-act="status" data-key="' + escapeHtml(key) + '" aria-label="진행 상태">' +
      STATUS_LIST.map(function (s) {
        return '<option' + (s === fav.status ? " selected" : "") + ">" + s + "</option>";
      }).join("") + "</select>" +
      '<input class="memo" data-act="memo" data-key="' + escapeHtml(key) + '" maxlength="200" ' +
      'placeholder="메모 (예: 컨소시엄 ○○사 연락, 11/3 내부 검토)" value="' + escapeHtml(fav.memo) + '" />' +
      "</div>" +
      (opts.gone ? '<p class="gone-note">최신 목록에서 빠진 공고입니다(마감·기간 경과 등). 저장해 둔 정보로 보여줍니다.</p>' : "");
  }

  return '' +
    '<article class="card' + (closed ? " is-closed" : "") + (fav ? " is-fav" : "") + (fresh ? " is-new" : "") + '">' +
      '<button class="star" data-act="star" data-type="' + type + '" data-id="' + escapeHtml(item.id) + '" ' +
        'aria-pressed="' + (fav ? "true" : "false") + '" aria-label="관심 공고 ' + (fav ? "해제" : "추가") + '" ' +
        'title="관심 공고 ' + (fav ? "해제" : "추가") + '">' + (fav ? "★" : "☆") + "</button>" +
      '<div class="card-top">' +
        (fresh ? '<span class="badge-new">NEW</span>' : "") +
        '<span class="dday ' + dday.cls + '">' + escapeHtml(dday.text) + "</span>" +
        tags +
      "</div>" +
      title +
      '<div class="meta">' + meta + "</div>" +
      renderFiles(type, item) +
      linked +
      renderGoNoGoBar(type, item) +
      favBox +
    "</article>";
}

/* 관심 공고 카드의 Go/No-Go 판단 버튼 (claude.ai에 붙여넣을 프롬프트를 만들어 줍니다) */
function renderGoNoGoBar(type, item) {
  if (!store.favs[keyOf(type, item)]) return "";      // 관심 공고에만 보여줍니다
  return '<div class="brief-bar">' +
    '<button class="ai-btn" data-act="gonogo" data-type="' + type + '" data-id="' + escapeHtml(item.id) + '">' +
      "🧭 Go/No-Go 판단 프롬프트</button>" +
  "</div>";
}

/* ---------- 7) 구역(관심 / 새 공고 / 전체) ---------- */
function renderSection(title, count, cardsHtml, emptyText, actionHtml) {
  return '<div class="section-head"><h2>' + title + "<small>" + count + "건</small></h2>" + (actionHtml || "") + "</div>" +
    (count ? '<div class="list">' + cardsHtml + "</div>" : '<p class="section-empty">' + emptyText + "</p>");
}

function render() {
  var type = ui.tab;
  var list = document.getElementById("list");
  var count = document.getElementById("count");

  document.getElementById("tab-note").textContent = TAB_NOTES[type];
  ["bid", "spec"].forEach(function (t) {
    var tab = document.getElementById("tab-" + t);
    tab.setAttribute("aria-selected", t === type ? "true" : "false");
    tab.textContent = (t === "bid" ? "입찰공고" : "사전규격") + (data.loaded[t] ? " " + data[t].length : "");
  });
  renderFilters();
  renderRegionOptions();

  if (!data.loaded[type]) {
    count.textContent = "";
    list.innerHTML = '<p class="empty">아직 수집된 ' + (type === "bid" ? "입찰공고" : "사전규격") + "가 없습니다.<br />" +
      "GitHub 저장소의 <b>Actions</b> 탭에서 <b>공고 수집 → Run workflow</b> 를 한 번 눌러주세요.</p>";
    return;
  }

  // 관심 공고는 필터와 상관없이 항상 맨 위에 고정합니다.
  var favs = sortRows(type, favItems(type));
  var favHtml = favs.map(function (f) { return renderCard(type, f.item, { gone: f.gone }); }).join("");

  var visible = data[type].filter(function (item) {
    return !store.favs[keyOf(type, item)] && passFilters(item);
  });
  var fresh = sortRows(type, visible.filter(function (item) { return isNew(type, item); }));
  var rest = sortRows(type, visible.filter(function (item) { return !isNew(type, item); }));

  var filtered = ui.keyword !== "전체" || ui.search || ui.budget || ui.region;
  count.textContent = "조건에 맞는 공고 " + (fresh.length + rest.length) + "건" +
    (filtered ? " (필터 적용 중)" : "") + " · 관심 공고 " + favs.length + "건";

  list.innerHTML =
    renderSection("⭐ 관심 공고", favs.length, favHtml,
      "공고 카드 오른쪽 위 ☆를 누르면 여기에 고정됩니다. 진행 상태·메모를 남기고, Go/No-Go 판단 프롬프트도 쓸 수 있습니다.") +
    renderSection("🆕 새로 나온 공고", fresh.length,
      fresh.map(function (item) { return renderCard(type, item); }).join(""),
      "마지막으로 확인한 뒤 새로 나온 공고가 없습니다.",
      fresh.length ? '<button class="mini-btn" data-act="ack">모두 확인함</button>' : "") +
    renderSection("📋 " + (type === "bid" ? "전체 공고" : "전체 사전규격"), rest.length,
      rest.map(function (item) { return renderCard(type, item); }).join(""),
      filtered ? "조건에 맞는 공고가 없습니다. 필터를 바꿔 보세요." : "표시할 공고가 없습니다.");

  document.getElementById("updated").textContent = data.updated[type]
    ? "마지막 갱신: " + data.updated[type] + " (한국시간)"
    : "아직 수집 전입니다.";
}

/* 키워드 버튼 */
function renderFilters() {
  var box = document.getElementById("filters");
  var buttons = ["전체"].concat(data.keywords);
  box.innerHTML = buttons.map(function (word) {
    var on = word === ui.keyword ? "true" : "false";
    return '<button class="chip" aria-pressed="' + on + '" data-word="' +
           escapeHtml(word) + '">' + escapeHtml(word) + "</button>";
  }).join("");
}

/* 지역 목록은 지금 탭에 실제로 있는 지역만, 건수와 함께 보여줍니다. */
function renderRegionOptions() {
  var counts = {};
  data[ui.tab].forEach(function (item) {
    var r = item.region || "전국·기타";
    counts[r] = (counts[r] || 0) + 1;
  });
  var options = REGION_ORDER.filter(function (r) { return counts[r] || r === ui.region; });
  document.getElementById("region").innerHTML =
    '<option value="">지역 전체</option>' +
    options.map(function (r) {
      return '<option value="' + escapeHtml(r) + '"' + (r === ui.region ? " selected" : "") + ">" +
             escapeHtml(r) + " (" + (counts[r] || 0) + ")</option>";
    }).join("");
}

/* 수집 실패 시 위쪽 안내 배너 */
function showBanner(lines) {
  if (!lines.length) return;
  var banner = document.getElementById("banner");
  banner.innerHTML = lines.join("<br /><br />");
  banner.style.display = "block";
}

/* ---------- 8) 백업 (다른 기기로 옮기기) ---------- */
function exportBackup() {
  var blob = new Blob([JSON.stringify({ favs: store.favs }, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "입찰공고퀵브리핑_관심공고_" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function importBackup(file) {
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var backup = JSON.parse(reader.result);
      var favs = backup && backup.favs;
      if (!favs || typeof favs !== "object") throw new Error("형식 오류");
      var added = 0;
      Object.keys(favs).forEach(function (key) {
        if (!favs[key] || !favs[key].item) return;
        if (!store.favs[key]) added++;
        store.favs[key] = favs[key];
      });
      saveStore();
      render();
      alert("관심 공고 " + Object.keys(favs).length + "건을 불러왔습니다. (새로 추가 " + added + "건)");
    } catch (e) {
      alert("백업 파일을 읽지 못했습니다. '관심 공고 백업 내려받기'로 만든 파일인지 확인하세요.");
    }
  };
  reader.readAsText(file);
}

/* ---------- 9) 클릭/입력 연결 ---------- */
function saveUi() {
  store.ui = { tab: ui.tab, budget: ui.budget, region: ui.region };
  saveStore();
}

document.querySelector(".tabs").addEventListener("click", function (event) {
  var tab = event.target.closest("[data-tab]");
  if (!tab) return;
  ui.tab = tab.dataset.tab;
  ui.region = "";            // 탭마다 지역 구성이 달라서 초기화합니다
  saveUi();
  render();
});

document.getElementById("filters").addEventListener("click", function (event) {
  var chip = event.target.closest(".chip");
  if (!chip) return;
  ui.keyword = chip.dataset.word;
  render();
});

document.getElementById("search").addEventListener("input", function (event) {
  ui.search = event.target.value.trim().toLowerCase();
  render();
});

document.getElementById("budget").addEventListener("change", function (event) {
  ui.budget = event.target.value;
  saveUi();
  render();
});

document.getElementById("region").addEventListener("change", function (event) {
  ui.region = event.target.value;
  saveUi();
  render();
});

document.getElementById("list").addEventListener("click", function (event) {
  var target = event.target.closest("[data-act]");
  if (!target) return;
  var act = target.dataset.act;
  if (act === "star") toggleFav(target.dataset.type, target.dataset.id);
  else if (act === "gonogo") {
    var gngItem = findItem(target.dataset.type, target.dataset.id) ||
      (store.favs[target.dataset.type + ":" + target.dataset.id] || {}).item;
    if (gngItem && window.GoNoGo) window.GoNoGo.open(target.dataset.type, gngItem);
  }
  else if (act === "ack") ackAll();
  else if (act === "open") {
    // 링크는 그대로 새 창으로 열리고, NEW 표시는 다음 화면 갱신 때 사라집니다.
    markSeen(target.dataset.type, target.dataset.id);
    var card = target.closest(".card");
    if (card) {
      card.classList.remove("is-new");
      var badge = card.querySelector(".badge-new");
      if (badge) badge.remove();
    }
  }
});

document.getElementById("list").addEventListener("change", function (event) {
  var target = event.target.closest("[data-act]");
  if (!target) return;
  if (target.dataset.act === "status") updateFav(target.dataset.key, "status", target.value);
  if (target.dataset.act === "memo") updateFav(target.dataset.key, "memo", target.value.trim());
});

document.getElementById("gng-open").addEventListener("click", function () {
  if (window.GoNoGo) window.GoNoGo.open();
});

document.getElementById("export").addEventListener("click", exportBackup);
document.getElementById("import").addEventListener("click", function () {
  document.getElementById("import-file").click();
});
document.getElementById("import-file").addEventListener("change", function (event) {
  if (event.target.files[0]) importBackup(event.target.files[0]);
  event.target.value = "";
});

/* ---------- 10) 페이지가 열리면 데이터 파일을 읽어옵니다 ---------- */
function getJson(path) {
  // 주소 뒤에 시각을 붙여 브라우저가 옛날 파일을 보여주지 않게 합니다.
  return fetch(path + "?t=" + Date.now()).then(function (response) {
    return response.ok ? response.json() : null;
  }).catch(function () { return null; });
}

function boot() {
  ui.tab = store.ui.tab === "spec" ? "spec" : "bid";
  ui.budget = store.ui.budget || "";
  ui.region = store.ui.region || "";
  document.getElementById("budget").innerHTML = BUDGETS.map(function (b) {
    return '<option value="' + b.value + '"' + (b.value === ui.budget ? " selected" : "") + ">" + b.label + "</option>";
  }).join("");

  Promise.all([getJson("data/notices.json"), getJson("data/prespecs.json"), getJson("data/status.json")])
    .then(function (results) {
      var notices = results[0], prespecs = results[1], status = results[2];
      if (notices) {
        data.bid = notices.notices || [];
        data.keywords = notices.keywords || [];
        data.updated.bid = notices.updated_at || "";
        data.loaded.bid = true;
      }
      if (prespecs) {
        data.spec = prespecs.prespecs || [];
        if (!data.keywords.length) data.keywords = prespecs.keywords || [];
        data.updated.spec = prespecs.updated_at || "";
        data.loaded.spec = true;
      }

      // 지금 목록에 없는 공고의 '열어봄' 기록은 정리합니다. (저장소가 계속 커지지 않게)
      Object.keys(store.seen).forEach(function (key) {
        var type = key.split(":")[0];
        if (data.loaded[type] && !findItem(type, key.slice(type.length + 1))) delete store.seen[key];
      });
      saveStore();

      var lines = [];
      if (status && status.ok === false) {
        lines.push("⚠️ 최근 입찰공고 자동 수집이 실패했습니다 (" + escapeHtml(status.checked_at) +
                   ").<br />아래 목록은 마지막으로 성공했던 데이터입니다.<br />사유: " + escapeHtml(status.message));
      }
      if (status && status.prespec && status.prespec.ok === false) {
        lines.push("⚠️ 최근 사전규격 수집이 실패했습니다 (" + escapeHtml(status.checked_at) +
                   ").<br />사유: " + escapeHtml(status.prespec.message));
      }
      showBanner(lines);
      render();
    });
}

boot();
</script>
<script src="gonogo.js"></script>
